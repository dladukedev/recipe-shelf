[package]
name = "recipe-shelf"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[dependencies]
topcoat = { version = "=0.9.0", default-features = false, features = ["asset", "router", "view", "serve", "cookie", "discover", "anyhow"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
anyhow = "1"
form_urlencoded = "1"
http = "1"
crc32fast = "1"
tempfile = "3"

